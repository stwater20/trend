name: Update trends

on:
  schedule:
    - cron: "17 * * * *"  # 每小時更新（避開整點尖峰）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-trends
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch trends
        run: python3 scripts/fetch_trends.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trends.json history.json index.html sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update trends $(TZ=Asia/Taipei date '+%F %H:%M')"
            git pull --rebase
            git push
          fi
